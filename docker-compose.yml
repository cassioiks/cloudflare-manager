services:
  cloudflare-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudflare-manager
    restart: unless-stopped
    ports:
      - "5480:5480"
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5480/api/ip"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
